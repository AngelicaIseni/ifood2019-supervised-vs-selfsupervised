<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Food Recognition — Supervised vs Self-Supervised Pretraining on iFood-2019</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1f2a"/>
      <stop offset="100%" stop-color="#0f3d3a"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d9e75"/>
      <stop offset="100%" stop-color="#0f6e56"/>
    </linearGradient>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4">
      <circle cx="5" cy="5" r="4" fill="#f2a65a"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- subtle grid texture -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <!-- title block -->
  <text x="70" y="115" font-family="Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#f4f1ea">
    Food Recognition
  </text>
  <text x="70" y="155" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#a9c9c0">
    Supervised CNNs vs self-supervised pretraining
  </text>
  <text x="70" y="185" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#a9c9c0">
    on iFood-2019 · 251 classes
  </text>

  <!-- small tag pills -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500">
    <rect x="70" y="215" width="88" height="28" rx="14" fill="#1d9e7533" stroke="#1d9e75" stroke-width="1"/>
    <text x="114" y="234" text-anchor="middle" fill="#8fe0c4">PyTorch</text>

    <rect x="170" y="215" width="120" height="28" rx="14" fill="#d85a3033" stroke="#d85a30" stroke-width="1"/>
    <text x="230" y="234" text-anchor="middle" fill="#f3b294">Lightning</text>

    <rect x="302" y="215" width="150" height="28" rx="14" fill="#37bee833" stroke="#37bee8" stroke-width="1"/>
    <text x="377" y="234" text-anchor="middle" fill="#9fe4f5">EfficientNet-B0</text>

    <rect x="464" y="215" width="130" height="28" rx="14" fill="#f2a65a33" stroke="#f2a65a" stroke-width="1"/>
    <text x="529" y="234" text-anchor="middle" fill="#fbd6ae">SimCLR</text>
  </g>

  <!-- right-side illustration: encoder network feeding into a plate -->
  <g transform="translate(760,0)">
    <!-- network layers -->
    <g stroke="#f2a65a" stroke-width="1.2" opacity="0.55">
      <line x1="20" y1="90"  x2="110" y2="70"/>
      <line x1="20" y1="90"  x2="110" y2="110"/>
      <line x1="20" y1="90"  x2="110" y2="150"/>
      <line x1="20" y1="150" x2="110" y2="70"/>
      <line x1="20" y1="150" x2="110" y2="110"/>
      <line x1="20" y1="150" x2="110" y2="150"/>
      <line x1="20" y1="210" x2="110" y2="110"/>
      <line x1="20" y1="210" x2="110" y2="150"/>
      <line x1="110" y1="70"  x2="190" y2="120"/>
      <line x1="110" y1="110" x2="190" y2="120"/>
      <line x1="110" y1="150" x2="190" y2="120"/>
    </g>
    <g fill="#f4f1ea">
      <circle cx="20" cy="90" r="6"/>
      <circle cx="20" cy="150" r="6"/>
      <circle cx="20" cy="210" r="6"/>
      <circle cx="110" cy="70" r="6"/>
      <circle cx="110" cy="110" r="6"/>
      <circle cx="110" cy="150" r="6"/>
    </g>
    <circle cx="190" cy="120" r="9" fill="#f2a65a"/>

    <!-- arrow into plate -->
    <line x1="205" y1="120" x2="245" y2="120" stroke="#f4f1ea" stroke-width="1.5" opacity="0.7"/>
    <polygon points="245,113 258,120 245,127" fill="#f4f1ea" opacity="0.7"/>

    <!-- plate with food dots -->
    <circle cx="330" cy="120" r="95" fill="url(#plate)" opacity="0.9"/>
    <circle cx="330" cy="120" r="95" fill="none" stroke="#f4f1ea" stroke-width="2" opacity="0.35"/>
    <circle cx="330" cy="120" r="68" fill="none" stroke="#f4f1ea" stroke-width="1" opacity="0.25"/>

    <circle cx="300" cy="95"  r="10" fill="#d85a30"/>
    <circle cx="355" cy="90"  r="7"  fill="#f2a65a"/>
    <circle cx="365" cy="140" r="9"  fill="#f4f1ea" opacity="0.85"/>
    <circle cx="310" cy="150" r="8"  fill="#37bee8" opacity="0.85"/>
    <circle cx="335" cy="118" r="6"  fill="#d85a30" opacity="0.85"/>
  </g>
</svg>
